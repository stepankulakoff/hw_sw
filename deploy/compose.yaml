services:
  service1:
    image: eclipse-temurin:17-jre
    command: ["java", "-Xmx128m", "-jar", "/app/app.jar"]
    volumes: ["./rate-provider.jar:/app/app.jar:ro"]
    environment:
      SERVER_PORT: "8080"
      ZOOKEEPER_ADDRESS: zookeeper:2181
      PROVIDER_HOST: service1
    ports: ["127.0.0.1:${PROVIDER1_PORT}:8080"]
    depends_on:
      zookeeper: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 60
    stop_grace_period: 60s

  service2:
    image: eclipse-temurin:17-jre
    command: ["java", "-Xmx128m", "-jar", "/app/app.jar"]
    volumes: ["./rate-provider.jar:/app/app.jar:ro"]
    environment:
      SERVER_PORT: "8080"
      ZOOKEEPER_ADDRESS: zookeeper:2181
      PROVIDER_HOST: service2
    ports: ["127.0.0.1:${PROVIDER2_PORT}:8080"]
    depends_on:
      zookeeper: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 60
    stop_grace_period: 60s

  client:
    image: eclipse-temurin:17-jre
    command: ["java", "-Xmx128m", "-jar", "/app/app.jar"]
    volumes: ["./rate-printer.jar:/app/app.jar:ro"]
    environment:
      SERVER_PORT: "8080"
      ZOOKEEPER_ADDRESS: zookeeper:2181
    ports: ["127.0.0.1:${PRINTER_PORT}:8080"]
    depends_on:
      service1: {condition: service_healthy}
      service2: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 60
    stop_grace_period: 60s

  zookeeper:
    image: zookeeper:3.9.5
    environment:
      ZOO_HEAP_SIZE: "128"
      ZOO_CFG_EXTRA: >-
        metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider
        metricsProvider.httpPort=7070
        metricsProvider.exportJvmInfo=true
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 15s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.5.5
    ports: ["127.0.0.1:${PROMETHEUS_PORT}:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 15s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.2
    ports: ["127.0.0.1:${GRAFANA_PORT}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: homework
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 15s
      retries: 30

volumes:
  prometheus-data:
  grafana-data:
