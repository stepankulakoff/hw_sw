spring.application.name=rate-provider
spring.main.banner-mode=off
server.port=${PROVIDER_PORT:8094}
discovery.address=${ZOOKEEPER_ADDRESS:localhost:52181}
discovery.path=/services/currency
logging.level.org.apache.zookeeper=WARN
logging.level.org.apache.curator=WARN
discovery.host=${PROVIDER_HOST:localhost}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1us
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
metrics.clients=${METRICS_CLIENTS:rate-printer,manual}
